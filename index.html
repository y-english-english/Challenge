<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英語ノック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: single phone-width column; pastel-mint hero tiles, white cards on a pale mint ground, peach call-to-action. Andika for Latin, Zen Maru Gothic for Japanese. */
:root{
  --bg:#f2faf6; --card:#ffffff; --ink:#3d5a51; --sub:#6f8d82; --line:#ddeee6;
  --c-miss:#f08aa0; --ch:var(--c-rank); --hero:#c9eddf; --pri:#a5e0c8; --pri-ink:#1f5a45; --pri-sub:#2f6f58; --pri-soft:#e6f6ee; --pri-text:#2f8f68;
  --overlay:rgba(31,90,69,.12); --overlay2:rgba(31,90,69,.22); --count:#7d6bd6;
  --cta:#ffcba4; --cta-ink:#7a3e12;
  --ok:#7fd6ae; --ok-soft:#e3f8ee; --ok-ink:#1f6b4d;
  --ng:#ff9dae; --ng-soft:#ffe9ee; --ng-ink:#9b2c43; --on-ng:#5c1020;
  --c-review:#5fcf9f; --c-basic:#6fb7e9; --c-links:#5fd0c2; --c-rec:#9aa8b8; --c-rank:#f5b24a;
  --chip:#ffffff; --chip-edge:#d5eadf; --shadow:rgba(47,143,104,.14);
  --f-ja:"Andika","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-en:"Andika","Zen Maru Gothic","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10211c; --card:#18302a; --ink:#e6f4ee; --sub:#93b5a8; --line:#284a40;
  --ch:#5fd6c8; --hero:#2a8264; --pri:#2a8264; --pri-ink:#ffffff; --pri-sub:rgba(255,255,255,.82); --pri-soft:#1f3d34; --pri-text:#8fe0bf;
  --overlay:rgba(255,255,255,.14); --overlay2:rgba(255,255,255,.26); --count:#d9d0ff;
  --cta:#ffb27a; --cta-ink:#3a1a05;
  --ok:#5fcf9f; --ok-soft:#123a2d; --ok-ink:#8be8c3; --ng:#ff8aa0; --ng-soft:#4a2029; --ng-ink:#ffb4c1; --on-ng:#3a0a12;
  --chip:#1f3d34; --chip-edge:#0d1a16; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10211c; --card:#18302a; --ink:#e6f4ee; --sub:#93b5a8; --line:#284a40;
  --ch:#5fd6c8; --hero:#2a8264; --pri:#2a8264; --pri-ink:#ffffff; --pri-sub:rgba(255,255,255,.82); --pri-soft:#1f3d34; --pri-text:#8fe0bf;
  --overlay:rgba(255,255,255,.14); --overlay2:rgba(255,255,255,.26); --count:#d9d0ff;
  --cta:#ffb27a; --cta-ink:#3a1a05;
  --ok:#5fcf9f; --ok-soft:#123a2d; --ok-ink:#8be8c3; --ng:#ff8aa0; --ng-soft:#4a2029; --ng-ink:#ffb4c1; --on-ng:#3a0a12;
  --chip:#1f3d34; --chip-edge:#0d1a16; --shadow:rgba(0,0,0,.4); color-scheme:dark}
:root[data-skin="pink"]{--bg:#fdf3f6;--line:#f4dde5;--hero:#f8c8d8;--pri:#f7bfd1;--pri-ink:#6b1f3c;--pri-sub:#8a3a56;--pri-soft:#fde8ef;--pri-text:#c2406f;--shadow:rgba(194,64,111,.14);--overlay:rgba(107,31,60,.12);--overlay2:rgba(107,31,60,.22);--chip-edge:#f0d3dd}
:root[data-skin="blue"]{--bg:#f1f7fd;--line:#d9e8f6;--hero:#b3d9f5;--pri:#b3d9f5;--pri-ink:#1d4468;--pri-sub:#2f5f8a;--pri-soft:#e4f1fb;--pri-text:#2f7bbd;--shadow:rgba(47,123,189,.14);--overlay:rgba(29,68,104,.12);--overlay2:rgba(29,68,104,.22);--chip-edge:#d0e4f4}
:root[data-skin="orange"]{--bg:#fff7ee;--line:#f6e3cc;--hero:#ffd1a1;--pri:#ffd1a1;--pri-ink:#6b3a0c;--pri-sub:#8a5320;--pri-soft:#fdeede;--pri-text:#c8731a;--shadow:rgba(200,115,26,.14);--overlay:rgba(107,58,12,.12);--overlay2:rgba(107,58,12,.22);--chip-edge:#f2dcc0}
:root[data-skin="purple"]{--bg:#f6f3fd;--line:#e5def5;--hero:#d5c6f5;--pri:#d5c6f5;--pri-ink:#3e2a7a;--pri-sub:#5a45a0;--pri-soft:#eee8fb;--pri-text:#6f55c8;--shadow:rgba(111,85,200,.14);--overlay:rgba(62,42,122,.12);--overlay2:rgba(62,42,122,.22);--chip-edge:#ddd3f2}
@media (prefers-color-scheme: dark){
:root[data-skin="pink"]:not([data-theme="light"]){--bg:#261620;--card:#3a2230;--line:#583346;--hero:#b0456f;--pri:#b0456f;--pri-ink:#fff;--pri-sub:rgba(255,255,255,.82);--pri-soft:#4a2a3b;--pri-text:#ffb3cc;--chip:#4a2a3b;--chip-edge:#1a0d14;--shadow:rgba(0,0,0,.4)}
:root[data-skin="blue"]:not([data-theme="light"]){--bg:#101c2a;--card:#182c42;--line:#284866;--hero:#2f78b8;--pri:#2f78b8;--pri-ink:#fff;--pri-sub:rgba(255,255,255,.82);--pri-soft:#1f3a56;--pri-text:#9ccdf5;--chip:#1f3a56;--chip-edge:#0b1520;--shadow:rgba(0,0,0,.4)}
:root[data-skin="orange"]:not([data-theme="light"]){--bg:#261a10;--card:#3a281a;--line:#5a4028;--hero:#c2691a;--pri:#c2691a;--pri-ink:#fff;--pri-sub:rgba(255,255,255,.82);--pri-soft:#4a331f;--pri-text:#ffc58a;--chip:#4a331f;--chip-edge:#1a1008;--shadow:rgba(0,0,0,.4)}
:root[data-skin="purple"]:not([data-theme="light"]){--bg:#1a1426;--card:#2a2040;--line:#43365f;--hero:#6a4fc0;--pri:#6a4fc0;--pri-ink:#fff;--pri-sub:rgba(255,255,255,.82);--pri-soft:#382c58;--pri-text:#cdbcff;--chip:#382c58;--chip-edge:#100b1a;--shadow:rgba(0,0,0,.4)}}
.wr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.coinb{background:var(--card);color:var(--pri-text);border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px;box-shadow:0 2px 0 var(--line);cursor:pointer}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pri-soft);font-size:20px;margin-right:6px;vertical-align:middle}
.shp .bal{background:var(--pri);color:var(--pri-ink);border-radius:22px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:900}.shp .bal b{font-size:34px}
.shp .tabs2{display:flex;gap:8px;margin:12px 0 8px}.shp .tabs2 button{flex:1;padding:9px;border-radius:99px;font-weight:800;background:var(--pri-soft);color:var(--pri-text);text-align:center}.shp .tabs2 button.on{background:var(--pri);color:var(--pri-ink)}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shi{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.shi .pv{width:100%;height:54px;border-radius:12px;display:grid;place-items:center;font-size:30px}.shi b{font-size:14px}.shi button{width:100%;border-radius:12px;padding:8px;font-weight:900;font-size:13px;background:var(--pri-soft);color:var(--pri-text);text-align:center}
.shi button.on{background:var(--pri);color:var(--pri-ink)}.shi button.buy{background:var(--cta);color:var(--cta-ink)}.shi button:disabled{opacity:.5;cursor:default}.shi.eqd{outline:3px solid var(--pri)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
svg{display:block;flex:none}
.eyebrow{font-family:var(--f-en);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* home */
.tile.pnk{--c:var(--c-miss)}.tile.amb{--c:#f5b301}.tile:disabled{opacity:.6;cursor:default}
.lsw{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:6px;padding:12px 16px 8px}
.lsw button{flex:1;padding:9px 0;border-radius:99px;font-weight:800;font-size:13px;text-align:center;background:var(--pri-soft);color:var(--pri-text)}
.lsw button.on{background:var(--pri);color:var(--pri-ink)}
.app .sheet{overflow:clip}

.chcard{display:block;width:100%;text-align:left;background:color-mix(in srgb,var(--ch) 13%,var(--card));border:2px solid color-mix(in srgb,var(--ch) 45%,var(--card));border-radius:22px;padding:16px;box-shadow:0 4px 12px var(--shadow)}
.chh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.chl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}.chl svg{width:22px;height:22px;color:var(--ch)}.chh b{color:var(--ch);font-family:var(--f-en)}
.chg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.chg i{display:block;font-style:normal;font-size:22px}.chg small{display:block;font-size:10px;font-weight:700}.chg em{font-style:normal;font-size:11px;font-weight:800;color:var(--ch)}
.chm{display:block;text-align:center;margin-top:12px;font-size:12px;font-weight:800;color:var(--sub)}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stg.sm{gap:6px}
.stp{border-radius:14px;padding:8px 2px 6px;text-align:center;background:var(--line);border:2px solid var(--line);color:var(--sub)}
.stp i{display:block;font-style:normal;font-size:30px;line-height:1.2;filter:grayscale(1);opacity:.4}.stp b{display:block;font-size:11px}
.stg.sm .stp{padding:5px 2px 3px}.stg.sm .stp i{font-size:22px}.stg.sm .stp b{font-size:10px}
.stp.t1,.stp.t2,.stp.t3{filter:none;color:var(--ink)}.stp.t1 i,.stp.t2 i,.stp.t3 i{filter:none;opacity:1}
.stp.t3{background:color-mix(in srgb,#f5c542 22%,var(--card));border-color:#f5c542}.stp.t2{background:color-mix(in srgb,#b8c4d2 22%,var(--card));border-color:#b8c4d2}.stp.t1{background:color-mix(in srgb,#e8b48a 22%,var(--card));border-color:#e8b48a}
.stcard{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 2px 0 var(--line)}
.stlg{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub);justify-content:center}.stlg span{display:flex;align-items:center;gap:5px}.dt{display:inline-block;width:12px;height:12px;border-radius:4px}.dt.t3{background:#f5c542}.dt.t2{background:#b8c4d2}.dt.t1{background:#e8b48a}
.fyr{display:flex;align-items:center;justify-content:center;gap:22px}.fyr b{font-size:22px;font-family:var(--f-en)}.fyb{font-size:30px;font-weight:800;color:var(--pri-text);padding:0 10px;line-height:1}.fyb:disabled{color:var(--line);cursor:default}
.bchips{display:flex;gap:6px;flex-wrap:wrap}.bchip{font-size:12px;font-weight:800;padding:7px 12px;border-radius:99px;background:var(--pri-soft);color:var(--pri-text)}.bchip.on{background:var(--pri);color:var(--pri-ink)}
.bsec{font-weight:800;font-size:14px;margin:14px 2px 8px}
.brow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:11px 14px;margin-bottom:8px;box-shadow:0 2px 0 var(--line)}
.bic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--ch) 22%,var(--card));flex:none}
.bt{min-width:0;flex:1}.bt b{display:block;font-size:15px}.bt small{display:block;font-size:12px;color:var(--sub)}
.bpg{height:6px;border-radius:4px;background:var(--line);margin-top:6px;max-width:200px}.bpg i{display:block;height:100%;background:var(--pri-text);border-radius:4px}.bt .bpn{font-size:11px;margin-top:2px}
.bok{font-size:12px;font-weight:800;color:var(--pri-text);flex:none}
.brow.no{background:color-mix(in srgb,var(--sub) 12%,var(--card));box-shadow:none}.brow.no .bic{filter:grayscale(1);opacity:.6;background:var(--line)}.brow.no .bt b{color:var(--sub)}
.newb{background:color-mix(in srgb,var(--ch) 16%,var(--card));border:2px solid color-mix(in srgb,var(--ch) 50%,var(--card));border-radius:16px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px}.newb b{width:100%;font-size:12px;color:var(--ch)}.newb span{font-weight:800}

.whead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 4px}
.hero .rank{background:var(--card);color:var(--ink);border:0;position:relative;z-index:1}
.hero .rank .big{font-size:18px}
.tile.lay{flex-direction:row;align-items:center;gap:16px}
.tile.lay .lic{color:var(--c);flex:none}.tile.lay .lic svg{width:40px;height:40px}
.tile.lay .eyebrow{display:block}
.tabbar{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:480px;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px var(--shadow);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:700;color:var(--sub);border-radius:14px}
.tabbar .tb svg{width:23px;height:23px}
.tabbar .tb.on{color:var(--pri-text);background:var(--pri-soft)}
.app.wt{padding-bottom:84px}
.wt .top .iconbtn,.wt .rhead .iconbtn2{visibility:hidden}
.pbg{font-style:normal;font-family:var(--f-en);font-size:11px;font-weight:800;background:var(--pri-soft);color:var(--pri-text);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

.welcome{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 0 var(--line)}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wname{font-size:22px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.wname .ed{display:inline-block;margin-top:6px;font-style:normal;font-size:12px;font-weight:800;color:var(--pri-text);background:var(--pri-soft);border-radius:99px;padding:4px 12px}
.wname small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.badge{background:var(--pri-soft);color:var(--pri-text);border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.rank{background:var(--pri-soft);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.rank .big{font-size:22px;font-weight:800}
.rank .next{font-size:14px;color:var(--sub)}
.rank .next b{display:block;color:var(--pri-text);font-size:20px;font-family:var(--f-en)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.hero{background:var(--pri);color:var(--pri-ink);border-radius:28px;padding:26px 24px;display:flex;flex-direction:column;gap:22px;box-shadow:0 14px 28px var(--shadow);position:relative;overflow:hidden}
.hero .eyebrow{color:var(--pri-sub)}
.hero h2{margin:0;font-size:34px;line-height:1.1;font-weight:800;display:flex;align-items:center;gap:10px}
.hero p{margin:0;color:var(--pri-sub);font-size:14px}
.hero .hgo{background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer;display:block;width:100%;position:relative;z-index:1;font:inherit}
.hero .sum2{display:flex;gap:10px;position:relative;z-index:1}.hero .sum2>*{flex:1;min-width:0;background:var(--card);color:var(--pri-text);border:0;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px;text-align:left;font:inherit}
.hero .sum2 .em{font-size:24px;line-height:1}.hero .sum2 b{display:block;font-size:15px;font-weight:900}.hero .sum2 small{font-size:11px;color:var(--sub);font-weight:700}
.hero .sum2 button{cursor:pointer}.hero .mp{position:relative;z-index:1;background:var(--card);color:var(--pri-text);border-radius:16px;padding:6px 14px 10px;box-shadow:none;text-align:left}.hero .mp[hidden]{display:none}
.hero .mp .dots{margin:6px 0 10px}.hero .mp .srw{display:flex;gap:8px;margin-bottom:8px}.hero .mp .srw>div{flex:1;background:var(--pri-soft);border-radius:12px;padding:8px;text-align:center}.hero .mp .srw b{display:block;font-size:20px;font-weight:900}.hero .mp .srw small{font-size:11px;color:var(--sub);font-weight:700}
.hero .mp .nl{font-size:13px;font-weight:800;padding:6px 2px;border-top:1px solid var(--line)}
.hero .mp .pt{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
.hero .ghost{position:absolute;right:-18px;bottom:-18px;opacity:.14}
.tile{--c:var(--pri);background:var(--card);border:2px solid color-mix(in srgb,var(--c) 30%,var(--card));border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;box-shadow:0 6px 16px var(--shadow);min-height:96px;width:100%}
.tile .eyebrow{color:var(--c)}
.tile h3{margin:0;font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px}
.tile p{margin:0;font-size:13px;color:var(--sub)}
.tile .ghost{position:absolute;right:-10px;bottom:-12px;color:var(--c);opacity:.16}
.tile.sky{--c:var(--c-basic)}.tile.grn{--c:var(--c-review)}.tile.teal{--c:var(--c-links)}.tile.gry{--c:var(--c-rec)}.tile.amb{--c:var(--c-rank)}
.hint{font-size:12px;color:var(--sub);text-align:center;padding:4px 0 8px}

/* sub screens */
.sheet{background:var(--card);border-radius:28px;box-shadow:0 12px 30px var(--shadow);overflow:hidden;display:flex;flex-direction:column;flex:1}
.top{background:var(--pri);color:var(--pri-ink);padding:18px 20px 22px;border-radius:0 0 28px 28px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;text-align:center}
.top .sm{font-size:12px;font-weight:700;color:var(--pri-sub);min-height:18px}
.top h2{margin:0;font-size:22px;font-weight:800;line-height:1.25}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--overlay);display:grid;place-items:center;color:var(--pri-ink)}
.list{padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px;background:var(--bg);flex:1}
.row{background:var(--card);border-radius:16px;padding:16px 16px 16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 0 var(--line);min-height:62px;width:100%}
.row b{font-size:17px;font-weight:800;display:block}
.row span.s{font-size:12px;color:var(--sub);display:block}
.row .go{width:36px;height:36px;border-radius:50%;background:var(--pri-soft);color:var(--pri-text);display:grid;place-items:center;flex:none}
.row:hover .go{background:var(--pri);color:var(--pri-ink)}
.gh{font-family:var(--f-en);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--pri-text);padding:10px 4px 0;text-transform:uppercase}

/* ready */
.ready{background:var(--pri);color:var(--pri-ink);border-radius:28px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 24px;position:relative;overflow:hidden;text-align:center}
.ready .back{position:absolute;left:16px;top:16px}
.ready h2{margin:0;font-family:var(--f-en);font-size:40px;font-weight:800}
.ready .box{background:var(--overlay);border:1px solid var(--overlay2);border-radius:18px;padding:18px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px}
.ready .box b{font-size:22px}
.ready .box em{font-style:normal;color:var(--pri-ink);font-weight:800;font-size:14px}
.cta{background:var(--cta);color:var(--cta-ink);font-family:var(--f-en);font-weight:800;font-size:20px;border-radius:16px;padding:16px;width:100%;max-width:340px;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.cta:active{transform:translateY(2px)}

/* countdown */
.count{background:var(--pri);color:var(--pri-ink);border-radius:28px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 14px 28px var(--shadow)}
.count .cnote{margin-top:14px;padding:8px 18px;border-radius:99px;background:var(--overlay);font-size:17px;font-weight:800;color:var(--pri-ink)}
.count .eyebrow{color:var(--pri-sub);font-size:20px;letter-spacing:.14em}
.cn{font-family:var(--f-en);font-weight:800;font-size:170px;line-height:1;color:var(--count);text-shadow:0 8px 18px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.cn.pop{animation:pop .85s ease-out}
@keyframes pop{0%{transform:scale(.45);opacity:0}30%{transform:scale(1.12);opacity:1}60%{transform:scale(1)}100%{transform:scale(.92);opacity:.85}}

/* game */
.game{background:var(--card);border-radius:28px;box-shadow:0 12px 30px var(--shadow);flex:1;display:flex;flex-direction:column;overflow:hidden}
.ghead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ghead .xbtn{color:var(--sub);width:40px;height:40px;display:grid;place-items:center}
.stats{display:flex;justify-content:center;gap:18px;font-family:var(--f-en);font-weight:800;font-size:20px}
.stats span{display:flex;align-items:center;gap:6px}
.stats .t.low{color:var(--ng)}
.stats .sc{color:var(--pri-text)}
.gbody{background:var(--bg);flex:1;padding:14px 16px 20px;display:flex;flex-direction:column;gap:16px}
.pgh{margin:14px 2px 0;display:flex;gap:8px;align-items:baseline;font-weight:800;color:var(--pri-text);font-size:13px}
.pgh em{font-style:normal;font-family:var(--f-en);background:#e8e2ff;color:#5a49b8;border-radius:99px;padding:2px 10px;font-size:12px}
.pgh span{color:var(--sub);font-weight:700;font-size:12px}
.pgh.none em{background:var(--line);color:var(--sub)}
.pg{font-family:var(--f-en);font-size:11px;font-weight:800;background:#e8e2ff;color:#5a49b8;border-radius:99px;padding:2px 9px;margin-left:6px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pgh em,:root:not([data-theme="light"]) .pg{background:#3a3470;color:#e0daff}}
:root[data-theme="dark"] .pgh em,:root[data-theme="dark"] .pg{background:#3a3470;color:#e0daff}
.tag{text-align:center;font-size:12px;font-weight:800;color:var(--sub)}
.ja .hint{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--sub)}
.ja{background:var(--pri-soft);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;font-size:19px;font-weight:800;color:var(--pri-text);text-wrap:balance}
.ans{background:var(--card);border:2px solid var(--line);border-radius:18px;min-height:128px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:border-color .15s,background .15s}
.ans:empty::before{content:"単語をタップして並べ替え";color:var(--sub);opacity:.7;font-weight:800;font-size:14px;margin:auto}
.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans.ng{border-color:var(--ng);background:var(--ng-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--chip);border-radius:12px;padding:10px 15px;min-height:46px;font-family:var(--f-en);font-weight:700;font-size:19px;box-shadow:0 3px 0 var(--chip-edge);border:1px solid var(--line);text-align:center}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.used{visibility:hidden}
.chip.cm{min-width:46px;padding:10px 12px}
.fb{min-height:48px;text-align:center;font-weight:800;font-size:15px;padding:0 4px}
.fb.ok{color:var(--ok-ink)}.fb.ng{color:var(--ng-ink)}
.fb .en{font-family:var(--f-en);font-size:18px;display:block}
.gfoot{display:flex;justify-content:center;gap:14px;margin-top:auto;padding-top:6px}
.pill{border-radius:99px;padding:14px 22px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.pill.undo{background:var(--ok-soft);color:var(--ok-ink)}
.pill.undo:disabled{opacity:.5;cursor:default}
.pill.quit{background:var(--ng);color:var(--on-ng)}

/* result */
.res{padding:24px 18px 26px;background:var(--bg);flex:1;display:flex;flex-direction:column;gap:16px}
.score{text-align:center;display:flex;flex-direction:column;gap:2px}
.score .n{font-family:var(--f-en);font-size:64px;font-weight:800;color:var(--pri-text);line-height:1}
.score .l{font-size:13px;color:var(--sub);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 2px 0 var(--line)}
.kpi b{display:block;font-family:var(--f-en);font-size:24px;font-weight:800}
.kpi span{font-size:11px;color:var(--sub);font-weight:700}
.up{background:var(--cta);color:var(--cta-ink);border-radius:14px;padding:12px 14px;text-align:center;font-weight:800}
.miss{display:flex;flex-direction:column;gap:8px}
.miss .m{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.miss .m small{display:block;color:var(--sub);font-size:12px;font-weight:700}
.miss .m b{font-family:var(--f-en);font-size:16px;overflow-wrap:anywhere}
.btns{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:4px}
.btns .cta{max-width:none}
.sec{background:var(--card);color:var(--pri-text);border:2px solid var(--line);border-radius:16px;padding:14px;font-weight:800;text-align:center}

/* study / history / ranking */
.srow{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:6px;width:100%}
.srow{position:relative;cursor:pointer;text-align:left;padding-right:52px}.stk,.dmc{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.stk .r{display:flex;align-items:center;gap:10px}.stk .fire{font-size:30px;line-height:1}
.stk .big{font-size:22px;font-weight:900;color:var(--pri-text);line-height:1.1}.stk .big small{font-size:12px;font-weight:700;color:var(--sub);margin-left:6px}
.dots{display:flex;gap:6px;justify-content:space-between;margin-top:10px}.dots span{flex:1;text-align:center;font-size:11px;color:var(--sub);font-weight:700}
.dots i{display:block;width:100%;aspect-ratio:1;max-width:34px;margin:0 auto 3px;border-radius:50%;background:var(--pri-soft);font-style:normal;line-height:34px;font-size:15px;color:#fff}
.dots i.on{background:var(--pri)}.dots i.td{outline:3px solid var(--pri);outline-offset:2px}
.dmc .gl{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--pri-text)}.dmc .gl em{font-style:normal;color:var(--sub);font-weight:700;font-size:12px}
.dmc .tx{font-size:14px;font-weight:800;line-height:1.3}
.dmr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.dmr:first-of-type{border-top:0}
.dmr .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--pri-soft);font-style:normal;color:#fff;text-align:center;line-height:22px;font-size:14px;font-weight:900}
.dmr.ok .ck{background:var(--pri);border-color:var(--pri)}.dmr .dx{flex:1;min-width:0}.dmr .rt{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.dmr.go{cursor:pointer}.dmr .chv{flex:none;color:var(--sub);font-size:20px;font-weight:900;margin-left:-4px}
.ovl{position:fixed;inset:0;background:rgba(20,40,32,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;animation:fi .25s}
.pop{background:var(--card);border-radius:28px;padding:28px 22px 22px;width:100%;max-width:330px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;overflow:hidden;animation:pu .35s cubic-bezier(.2,1.4,.4,1)}
.pop .em{font-size:64px;line-height:1}.pop h3{margin:10px 0 4px;font-size:24px;font-weight:900;color:var(--pri-text)}.pop .sub{font-size:14px;color:var(--sub);font-weight:700}
.pop .lst{margin:14px 0;display:flex;flex-direction:column;gap:6px;text-align:left}.pop .lst div{display:flex;justify-content:space-between;gap:8px;background:var(--pri-soft);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--pri-text)}
.pop .bg{font-size:34px;font-weight:900;color:#e08a00;margin:8px 0}.pop button{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;background:var(--pri);color:var(--pri-ink,#fff);cursor:pointer}
.cf{position:absolute;inset:0;pointer-events:none;overflow:hidden}.cf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:cfall 2.4s linear infinite}
.toast{position:fixed;top:14px;left:14px;right:14px;max-width:460px;margin:0 auto;z-index:50;background:var(--card);border:2px solid var(--pri);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 26px rgba(0,0,0,.2);animation:ts .35s ease-out}
.toast .em{font-size:30px}.toast b{display:block;font-size:15px;color:var(--pri-text)}.toast small{color:var(--sub);font-weight:700}.toast .pt{margin-left:auto;font-weight:900;color:#e08a00;font-size:18px;white-space:nowrap}
@keyframes fi{from{opacity:0}}@keyframes pu{from{transform:scale(.7);opacity:0}}@keyframes ts{from{transform:translateY(-70px);opacity:0}}@keyframes cfall{to{transform:translateY(420px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.ovl,.pop,.toast,.cf i{animation:none}}
.wkc{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 0 var(--line)}
.wkc .chh{margin-bottom:6px}.wkc .chh b{color:var(--sub);font-size:12px;font-family:inherit}.wkc .chl{font-size:16px}
.wkc .dots{margin:4px 0 12px}.wkc .dots i.fu{opacity:.35}
.wkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wkg>div{background:var(--pri-soft);border-radius:14px;padding:10px 6px;text-align:center}
.wkg b{display:block;font-size:20px;font-weight:900;color:var(--pri-text);line-height:1.15}.wkg span{display:block;font-size:11px;color:var(--sub);font-weight:700}
.wkg em{display:block;font-style:normal;font-size:11px;font-weight:800;margin-top:2px}.wkg em.up{color:#2e9b6f}.wkg em.dn{color:#d9657d}.wkg em.eq{color:var(--sub)}
.wkc .ms{margin-top:10px;font-size:13px;font-weight:800;color:var(--pri-text);text-align:center}
.dmr .rt small{font-size:11px;color:var(--sub);font-weight:700}
.dmc .gb{height:7px;border-radius:9px;background:var(--pri-soft);overflow:hidden;margin-top:6px}.dmc .gb b{display:block;height:100%;background:var(--pri);border-radius:9px}
.dmc .pt{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
.dmc .bn{background:var(--pri-soft);color:var(--pri-text);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900}
.dmc.done{outline:2px solid var(--pri)}.dmc.done .gb b{background:var(--pri)}
.srow .jj{font-weight:800}.stbtn{position:absolute;top:6px;right:6px;width:40px;height:40px;border:0;background:none;font-size:24px;line-height:1;color:var(--sub);opacity:.55;cursor:pointer;border-radius:12px}.stbtn.on{opacity:1;color:#f5b301}.mk{display:inline-block;font-style:normal;font-size:11px;font-weight:800;background:var(--c-miss);color:#fff;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}.mkc{color:var(--c-miss);font-weight:800}.stc{font-weight:800}.fsw{display:flex;gap:8px;margin-bottom:4px}.fsw button{flex:1;border:0;border-radius:12px;padding:9px;font-weight:800;background:var(--card);color:var(--sub);box-shadow:0 2px 0 var(--line);cursor:pointer}.fsw button.on{background:var(--pri);color:#fff}
.srow .ee{font-family:var(--f-en);font-weight:600;font-size:17px;color:var(--pri-text);overflow-wrap:anywhere}
.srow.hide .ee{filter:blur(7px);user-select:none}
.srow .tip{font-size:11px;color:var(--sub)}
.srow:not(.hide) .tip{display:none}
.hrow{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 2px 0 var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between}
.hrow .l{min-width:0}
.hrow b{display:block;font-size:15px;overflow-wrap:anywhere}
.hrow small{color:var(--sub);font-size:12px}
.hrow .p{font-family:var(--f-en);font-weight:800;font-size:20px;color:var(--pri-text);white-space:nowrap}
.pos{width:34px;height:34px;border-radius:50%;background:var(--pri-soft);color:var(--pri-text);display:grid;place-items:center;font-family:var(--f-en);font-weight:800;flex:none}
.pos.g1{background:#fde68a;color:#7c3a0b}.pos.g2{background:#e5e7eb;color:#374151}.pos.g3{background:#fed7aa;color:#7c2d12}
.empty{text-align:center;color:var(--sub);padding:34px 12px;font-weight:700}
.note{font-size:12px;color:var(--sub);text-align:center;padding:2px 8px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.form{display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.form input{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-size:18px;font-weight:700}
.cta:disabled{opacity:.5;cursor:default}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.qb{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:9px 15px;font-weight:800;font-size:14px;color:var(--pri-text);min-height:42px}
.qb.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.row.chk{justify-content:flex-start;gap:14px}
.chk .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
.chk.on{box-shadow:0 0 0 2px var(--pri)}
.chk.on .bx{background:var(--pri);border-color:var(--pri)}
.chk.on .bx::after{content:"";width:11px;height:6px;border-left:3px solid var(--pri-ink);border-bottom:3px solid var(--pri-ink);transform:rotate(-45deg) translate(1px,-1px)}
.stickybar{position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.stickybar .cta{max-width:none}
/* report */
.rhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.rhead h2{margin:0;font-size:20px;font-weight:800}
.iconbtn2{width:36px;height:36px;display:grid;place-items:center;color:var(--sub);border-radius:50%}
.rbody{background:var(--bg);padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;flex:1}
.hero2{background:var(--pri);color:var(--pri-ink);border-radius:22px;padding:18px 20px;box-shadow:0 10px 22px var(--shadow);display:flex;flex-direction:column;gap:2px}
.hero2 span{font-size:13px;color:var(--pri-sub);font-weight:700}
.hero2 b{font-family:var(--f-en);font-size:42px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 0 var(--line);min-width:0}
.mini span{font-size:12px;color:var(--sub);font-weight:700}
.mini b{font-family:var(--f-en);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px}
.thead{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.tl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.tl svg{color:var(--c-rank)}
.thead>b{font-family:var(--f-en);color:var(--pri-text);font-size:15px}
.tlist{max-height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:6px;overscroll-behavior:contain}
.ti{--tc:#10b981;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;background:var(--card);min-height:70px}
.ti.t2{--tc:#0ea5e9}.ti.t3{--tc:#8b5cf6}.ti.t4{--tc:#f59e0b}.ti.t5{--tc:#ec4899}
.ti .tb{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,var(--card));color:var(--tc)}
.ti .tm{min-width:0;display:flex;flex-direction:column}
.ti small{font-size:11px;font-weight:700;color:var(--sub)}
.ti .tm small{color:var(--pri-text)}
.ti .tm b{font-size:17px;font-weight:800;overflow-wrap:anywhere;line-height:1.3}
.ti .tr{display:flex;flex-direction:column;align-items:flex-end}
.ti .tr b{font-family:var(--f-en);font-size:16px;color:var(--pri-text);font-variant-numeric:tabular-nums}
.ti.lock{background:color-mix(in srgb,var(--sub) 13%,var(--card));border-color:transparent}
.ti.lock .tb{background:color-mix(in srgb,var(--sub) 22%,var(--card));color:var(--sub);font-size:24px;font-weight:700}
.ti.lock .tm b,.ti.lock .tr b,.ti.lock .tm small{color:var(--sub)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 2px 0 var(--line)}
.tab{background:var(--pri-soft);color:var(--pri-text);border-radius:14px;padding:12px 4px;font-weight:800;font-size:14px;text-align:center;white-space:nowrap;min-height:46px}
.tab.on{background:var(--pri);color:var(--pri-ink)}
.shd{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:0 4px}
.shd svg{color:var(--c-rank)}
.hlist{display:flex;flex-direction:column;gap:10px}
.hi{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 2px 0 var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px}
.hl-l{min-width:0;display:flex;flex-direction:column}
.hl-l small{font-size:12px;font-weight:800;color:var(--pri-text)}
.hl-l b{font-size:16px;font-weight:800;overflow-wrap:anywhere;line-height:1.35}
.hs{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.hs b{font-family:var(--f-en);font-size:22px;font-weight:800;color:var(--pri-text);font-variant-numeric:tabular-nums;line-height:1.1}
.hs small{font-size:11px;color:var(--sub);font-weight:700}
.np{color:var(--sub);opacity:.6;font-weight:700;font-size:14px;white-space:nowrap}
.fl{font-style:normal;font-size:11px;font-weight:800;background:var(--ok-soft);color:var(--ok-ink);border-radius:99px;padding:2px 9px;margin:4px 0 2px;display:block;width:max-content;white-space:nowrap}
.dangerlink{color:var(--sub);font-size:12px;text-align:center;text-decoration:underline;padding:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero h2{font-size:28px}.score .n{font-size:52px}.chip{padding:9px 12px;font-size:17px}}
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;box-shadow:0 4px 14px var(--shadow);gap:2px;width:100%}
.seg button{flex:1;text-align:center;border:0;background:none;border-radius:12px;padding:9px 2px;font-weight:900;font-size:12px;color:var(--sub);font-family:inherit}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.tile.ut{--c:#f0a35e}
.utrow{border:3px solid #ffcba4}.newt{font-style:normal;background:#ffcba4;color:#7a3e12;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:900;margin-left:4px;vertical-align:middle}
#kbox,#cbox{display:flex;flex-direction:column;gap:16px}
.cq{font-family:var(--f-en);font-weight:800;font-size:22px;line-height:1.6;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;overflow-wrap:anywhere}
.cq .bl{display:inline-block;min-width:70px;border-bottom:3px solid var(--pri-text);color:var(--pri-text)}

["私は本を読むのが好きです。","I like to read books."],["私は水を飲みたいです。","I want to drink water."],["彼は医者になりたいです。","He wants to be a doctor."],
["歌うことは楽しいです。","To sing is fun."],["私の夢は先生になることです。","My dream is to be a teacher."],["彼女はピアノをひくのが好きです。","She likes to play the piano."],
["あなたは何になりたいですか。","What do you want to be?"],["彼はテニスをし始めました。","He started to play tennis."],
["英語を勉強することは大切です。","To study English is important."],["私はイギリスに行きたいです。","I want to go to England."]]},
{g:2,id:"b11",t:"不定詞（副詞的用法）",s:"～するために（目的）",q:[
["私は写真をとるために公園に行きました。","I went to the park to take pictures."],["私は英語を勉強するために学校に行きます。","I go to school to study English."],
["彼は本を買うために店に行きました。","He went to the shop to buy a book."],["彼女は友だちに会うために駅に行きました。","She went to the station to meet her friend."],
["私は昼ごはんを食べるために家に帰りました。","I came home to eat lunch."],["彼らはサッカーをするために公園に行きます。","They go to the park to play soccer."],
["私は宿題をするために早く起きました。","I got up early to do my homework."],["私は水を買うために店に行きました。","I went to the store to buy water."],
["母は夕食を作るために台所に行きました。","My mother went to the kitchen to make dinner."],["私たちは映画を見るために町に行きます。","We go to town to see a movie."]]},
{g:2,id:"b12",t:"不定詞（形容詞的用法）",s:"名詞 + to + 動詞",q:[
["私は何か飲むものがほしいです。","I want something to drink."],["私は今日、するべき宿題があります。","I have homework to do today."],
["彼女は読む本をたくさん持っています。","She has many books to read."],["私は何か食べるものがほしいです。","I want something to eat."],
["私たちには遊ぶ時間がありません。","We have no time to play."],["彼には今日会う友だちがいます。","He has a friend to meet today."],
["私は何か冷たい飲み物がほしいです。","I want something cold to drink."],["見るべき場所がたくさんあります。","There are many places to see."],
["あなたは何か食べるものを持っていますか。","Do you have anything to eat?"],["私は今日、洗うべき皿がたくさんあります。","I have many dishes to wash today."]]},
{g:2,id:"b13",t:"不定詞（感情の原因）",s:"～して…だ（glad / sad / sorry など）",q:[
["私はあなたに会えてうれしいです。","I am happy to see you."],["私はその知らせを聞いて悲しいです。","I am sad to hear the news."],
["私は彼の手紙を読んでうれしかったです。","I was glad to read his letter."],["私はそれを見て驚きました。","I was surprised to see it."],
["遅れてごめんなさい。","I am sorry to be late."],["私たちは彼女に会えてうれしかったです。","We were glad to meet her."],
["私はそのニュースを聞いて驚きました。","I was surprised to hear the news."],["彼は試合に勝ってうれしいです。","He is happy to win the game."],
["私はあなたの声が聞けてうれしいです。","I am glad to hear your voice."],["彼女はプレゼントをもらってうれしかったです。","She was happy to get a present."]]},
{g:2,id:"b16",t:"助動詞 must（肯定・否定・疑問）",s:"must / must not（禁止）",q:[
["私は今、宿題をしなければなりません。","I must do my homework now."],["あなたはここで走ってはいけません。","You must not run here."],
["私たちは学校のきまりを守らなければなりません。","We must follow the school rules."],["あなたは早く寝なければなりません。","You must go to bed early."],
["ここで写真をとってはいけません。","You must not take pictures here."],["私は行かなければなりませんか。","Must I go?"],
["あなたはその部屋に入ってはいけません。","You must not go into that room."],["彼女は医者に行かなければなりません。","She must see a doctor."],
["私たちは時間を守らなければなりません。","We must be on time."],["あなたは水をたくさん飲まなければなりません。","You must drink a lot of water."]]},
{g:2,id:"b15",t:"have to（義務・必要）",s:"肯定・否定・疑問（has / have）",q:[
["私は今日、宿題をしなければなりません。","I have to do my homework today."],["彼は早く起きなければなりません。","He has to get up early."],
["私たちは学校で制服を着なければなりません。","We have to wear uniforms at school."],["あなたは今日、行かなければなりませんか。","Do you have to go today?"],
["彼女は今日、働かなくてもいいです。","She does not have to work today."],["私は明日、早く起きなくてもいいです。","I do not have to get up early tomorrow."],
["あなたはこの部屋をそうじしなければなりません。","You have to clean this room."],["彼は医者に会わなければなりませんか。","Does he have to see a doctor?"],
["私たちは今、帰らなければなりません。","We have to go home now."],["私は犬を散歩させなければなりません。","I have to walk my dog."]]},
{g:2,id:"b17",t:"助動詞の会話表現（許可・依頼・提案・助言）",s:"can / may / will / shall / should / could / would",q:[
["窓を開けてもいいですか。","May I open the window?"],["手伝ってくれますか。","Can you help me?"],["ドアを閉めてくれませんか。","Could you close the door?"],
["窓を開けましょうか。","Shall I open the window?"],["いっしょに行きましょうか。","Shall we go together?"],["あなたはもっと寝るべきです。","You should sleep more."],
["このペンを使ってもいいですか。","Can I use this pen?"],["お茶はいかがですか。","Would you like some tea?"],
["もっとゆっくり話してくれませんか。","Could you speak more slowly?"],["あなたは医者に行くべきです。","You should see a doctor."]]},
{g:2,id:"b13a",t:"疑問詞 + to + 動詞の原形",s:"how/what/where/when/which + to + 動詞",q:[
["私はこの機械の使い方を知りません。","I do not know how to use this machine."],["駅への行き方を教えてください。","Please tell me how to get to the station."],
["私は何を言えばいいかわかりません。","I do not know what to say."],["彼は次にどこへ行けばいいか知りたいです。","He wants to know where to go next."],
["いつ始めればいいか教えてください。","Please tell me when to start."],["私はどちらを選べばいいかわかりません。","I do not know which to choose."],
["私はこの単語の読み方を知っています。","I know how to read this word."],["彼女は泳ぎ方を知っています。","She knows how to swim."],
["何を買えばいいか教えてください。","Please tell me what to buy."],["私たちはどこで会えばいいか決めました。","We decided where to meet."]]},
{g:2,id:"b05",t:"SVC（五感・変化）",s:"look / sound / taste / feel / smell / become / get",q:[
["あなたは幸せそうに見えます。","You look happy."],["それはおもしろそうに聞こえます。","That sounds interesting."],["このスープはおいしいです。","This soup tastes good."],
["私は今日、疲れています。","I feel tired today."],["この花はよいにおいがします。","This flower smells nice."],["彼女は先生になりました。","She became a teacher."],
["外は暗くなりました。","It got dark outside."],["彼はとても疲れて見えます。","He looks very tired."],["この音楽は悲しく聞こえます。","This music sounds sad."],

{g:2,id:"b07",t:"SVOO（give / show / tell / buy）",s:"動詞 + 人 + 物（第4文型）",q:[

{g:2,id:"d08",t:"like ~ better than / the best",s:"AよりBが好き・一番好き",q:[
["私は犬よりねこのほうが好きです。","I like cats better than dogs."],["私は英語より数学のほうが好きです。","I like math better than English."],["あなたは犬よりねこが好きですか。","Do you like cats better than dogs?"],["トムはテニスよりサッカーのほうが好きです。","Tom likes soccer better than tennis."],["彼女は紅茶よりコーヒーのほうが好きです。","She likes coffee better than tea."],["あなたは数学より音楽が好きですか。","Do you like music better than math?"],["私の兄はサッカーよりテニスのほうが好きです。","My brother likes tennis better than soccer."],["私は肉より魚のほうが好きです。","I like fish better than meat."],["私はりんごよりバナナのほうが好きです。","I like bananas better than apples."],["あなたは数学より英語が好きですか。","Do you like English better than math?"],["あなたは犬とねこでは、どちらが好きですか。","Which do you like better, dogs or cats?"],["あなたは数学と英語では、どちらが好きですか。","Which do you like better, math or English?"],["あなたはコーヒーと紅茶では、どちらが好きですか。","Which do you like better, coffee or tea?"],["あなたはテニスとサッカーでは、どちらが好きですか。","Which do you like better, tennis or soccer?"],["あなたは肉と魚では、どちらが好きですか。","Which do you like better, meat or fish?"],["あなたはりんごとバナナでは、どちらが好きですか。","Which do you like better, apples or bananas?"],["私は夏が一番好きです。","I like summer the best."],["私は犬が一番好きです。","I like dogs the best."],["あなたはどの教科が一番好きですか。","Which subject do you like the best?"],["トムはサッカーが一番好きです。","Tom likes soccer the best."],["彼女はりんごが一番好きです。","She likes apples the best."],["あなたはどの季節が一番好きですか。","Which season do you like the best?"],["私の兄は音楽が一番好きです。","My brother likes music the best."],["あなたはどの動物が一番好きですか。","Which animal do you like the best?"],["私は英語が一番好きです。","I like English the best."],["あなたはどの色が一番好きですか。","Which color do you like the best?"]]},
{g:2,id:"r01",t:"3単現（まぎらわしい形）",s:"likes / like、does / do など",q:[
["彼女は毎日、英語を勉強します。","She studies English every day.","","study"],["ケンは犬を飼っています。","Ken has a dog.","","have"],["私の姉は朝6時に起きます。","My sister gets up at six.","","get"],["彼は学校に行きます。","He goes to school.","","go"],["彼女は英語を話しません。","She does not speak English.","","speaks"],["トムはサッカーをしますか。","Does Tom play soccer?","","plays"],["私の母は夜、テレビを見ます。","My mother watches TV at night.","","watch"],["彼は肉を食べません。","He does not eat meat.","","eats"],["彼女は犬が好きです。","She likes dogs.","","like"],["ミキは毎日、ピアノをひきます。","Miki plays the piano every day.","","play"]]},
{g:2,id:"r02",t:"be動詞・一般動詞の使い分け",s:"am / is / are と do / does",q:[
["私は学生です。","I am a student.","","is"],["彼は先生です。","He is a teacher.","","are"],["あなたは忙しいですか。","Are you busy?","","is"],["私たちはテニスをします。","We play tennis.","","are"],["あなたは犬を飼っていますか。","Do you have a dog?","","are"],["彼らは学生ではありません。","They are not students.","","do"],["私は犬が好きではありません。","I do not like dogs.","","am"],["彼女は医者ですか。","Is she a doctor?","","does"],["彼は毎日歩きます。","He walks every day.","","is"],["私の犬は大きいです。","My dog is big.","","are"]]},
{g:2,id:"r03",t:"過去形・現在進行形",s:"went / go、was / were、~ing",q:[
["私は昨日、サッカーをしました。","I played soccer yesterday.","","play"],["彼は昨日、公園に行きました。","He went to the park yesterday.","","goed"],["あなたは昨日、宿題をしましたか。","Did you do your homework yesterday?","","done"],["私は昨日、家にいました。","I was at home yesterday.","","were"],["彼らは昨日、忙しかったです。","They were busy yesterday.","","was"],["私は昨日、本を読みませんでした。","I did not read a book yesterday.","","was"],["彼女は今、料理をしています。","She is cooking now.","","cooks"],["私たちは今、テレビを見ています。","We are watching TV now.","","watch"],["彼は昨日、何を食べましたか。","What did he eat yesterday?","","ate"],["子どもたちは外で遊んでいました。","The children were playing outside.","","played"]]},
{g:2,id:"r04",t:"代名詞・複数形・疑問詞",s:"him / his、複数形、what / where",q:[
["私は彼を知っています。","I know him.","","his"],["これは彼の本です。","This is his book.","","him"],["あの家は彼らのものです。","That house is theirs.","","their"],["彼は私たちを手伝います。","He helps us.","","our"],["私は犬を2匹飼っています。","I have two dogs.","","dog"],["子どもたちは公園にいます。","The children are in the park.","","child"],["あなたはどこに住んでいますか。","Where do you live?","","when"],["あなたは何がほしいですか。","What do you want?","","who"],["このかばんはあなたのものですか。","Is this bag yours?","","your"],["これらの女の子はだれですか。","Who are these girls?","","girl"]]},
{g:3,id:"r05",t:"1年の復習（3単現・過去形・代名詞）",s:"1年のまぎらわしい文法をまとめて",q:[
["彼女は毎日、バスで学校に行きます。","She goes to school by bus every day.","","go"],["彼は昨日、友だちに会いました。","He met his friend yesterday.","","him"],["私の兄は朝ごはんを食べません。","My brother does not eat breakfast.","","eats"],["私たちは昨日、映画を見ました。","We saw a movie yesterday.","","seen"],["彼女は今、本を読んでいます。","She is reading a book now.","","reads"],["あの男の子たちは私の友だちです。","Those boys are my friends.","","boy"],["あれは私たちの学校です。","That is our school.","","us"],["トムは昨日、忙しかったですか。","Was Tom busy yesterday?","","were"],["彼女はどこに住んでいますか。","Where does she live?","","lives"],["あなたは昨日、どこに行きましたか。","Where did you go yesterday?","","went"]]},
{g:3,id:"r06",t:"2年の復習（助動詞・未来・不定詞・動名詞）",s:"will / must / have to、to + 原形、~ing",q:[
["私は明日、買い物に行くつもりです。","I am going to go shopping tomorrow.","","goes"],["彼は明日、来るでしょう。","He will come tomorrow.","","comes"],["私は今、宿題をしなければなりません。","I must do my homework now.","","to"],["彼は早く起きなければなりません。","He has to get up early.","","have"],["私は本を読むのが好きです。","I like to read books.","","reading"],["私は音楽を聞くのを楽しみました。","I enjoyed listening to music.","","listen"],["私は水を飲みたいです。","I want to drink water.","","drinking"],["彼は医者になりたいです。","He wants to be a doctor.","","want"],["あなたはここで走ってはいけません。","You must not run here.","","runs"],["私は写真をとるために公園に行きました。","I went to the park to take pictures.","","taking"]]},
{g:3,id:"r07",t:"2年の復習（比較・最上級・受け身）",s:"-er / more、the -est、過去分詞",q:[
["私はケンより背が高いです。","I am taller than Ken.","","tallest"],["この本はあの本よりおもしろいです。","This book is more interesting than that one.","","most"],["トムはクラスで一番背が高いです。","Tom is the tallest in the class.","","taller"],["今日は昨日より暑いです。","Today is hotter than yesterday.","","hot"],["これは世界で一番大きい動物です。","This is the biggest animal in the world.","","bigger"],["この本は多くの人に読まれています。","This book is read by many people.","","reads"],["この絵は私の兄がかきました。","This picture was painted by my brother.","","paint"],["英語は日本で話されていますか。","Is English spoken in Japan?","","speak"],["このケーキは母によって作られました。","This cake was made by my mother.","","make"],["私は犬よりねこのほうが好きです。","I like cats better than dogs.","","best"]]},
{g:3,id:"r08",t:"2年の復習（接続詞・SVOO・I think）",s:"when / if / because、give / show / tell、think",q:[
["雨が降ったら、私は家にいます。（If で始める）","If it rains, I will stay home.","","rained"],["私は忙しいので、行けません。（Because は文の途中）","I cannot go because I am busy.","","so"],["私が家に帰ったとき、母は料理をしていました。（When で始める）","When I came home, my mother was cooking.","","come"],["私は母にプレゼントをあげました。","I gave my mother a present.","","to"],["彼は私に写真を見せました。","He showed me a picture.","","my"],["彼女は私に名前を教えました。","She told me her name.","","tell"],["私は彼は親切だと思います。","I think he is kind.","","thinks"],["私は彼は来ないと思います。","I don't think he will come.","","not"],["あなたは幸せそうに見えます。","You look happy.","","looks"],["この音楽は悲しく聞こえます。","This music sounds sad.","","sound"]]},
{g:2,id:"b23",t:"同等比較（as ~ as）",s:"A is as ~ as B",q:[
["この犬は私の犬と同じくらい大きいです。","This dog is as big as my dog."],["私はケンと同じくらい背が高いです。","I am as tall as Ken."],
["この本はあの本と同じくらいおもしろいです。","This book is as interesting as that one."],["彼女は私と同じくらい上手に歌います。","She sings as well as me."],
["今日は昨日と同じくらい暑いです。","Today is as hot as yesterday."],["私の部屋はあなたの部屋と同じくらい広いです。","My room is as large as your room."],
["トムはケンと同じくらい速く走ります。","Tom runs as fast as Ken."],["私はケンほど背が高くありません。","I am not as tall as Ken."],
["この問題はあの問題ほど難しくありません。","This question is not as difficult as that one."],["私の犬はあなたの犬と同じくらい強いです。","My dog is as strong as your dog."]]},
{g:2,id:"b24",t:"受け身（be + 過去分詞）",s:"受け身の肯定・否定・疑問",q:[
["この本は多くの人に読まれています。","This book is read by many people."],["英語は世界中で話されています。","English is spoken all over the world."],
["この部屋は毎日そうじされます。","This room is cleaned every day."],["この絵は私の兄がかきました。","This picture was painted by my brother."],
["その窓はトムによってこわされました。","The window was broken by Tom."],["この車は日本で作られていません。","This car is not made in Japan."],
["この歌は若い人々に愛されています。","This song is loved by young people."],["英語は日本で話されていますか。","Is English spoken in Japan?"],
["このケーキは母によって作られました。","This cake was made by my mother."],["この手紙は昨日書かれました。","This letter was written yesterday."],
["この寺は多くの人に訪れられます。","This temple is visited by many people."],["その店は10時に開けられます。","The shop is opened at ten."],
["この学校は100年前に建てられました。","This school was built a hundred years ago."],["この写真はケンによって撮られました。","This picture was taken by Ken."],

["この花は何と呼ばれていますか。","What is this flower called?"],["その歌は世界中で歌われています。","That song is sung all over the world."]]},
{g:3,id:"c09",t:"want / tell / ask / help / teach + 人 + to",s:"want/tell/ask/help/teach + 人 + to + 動詞",q:[

{g:3,id:"c08",t:"It is + 形容詞 + for + 人 + to",s:"It is ... for ... to ... の構文",q:[
["英語を勉強することは私にとって大切です。","It is important for me to study English."],["本を読むことは彼にとって簡単です。","It is easy for him to read books."],
["早く起きることは私にとって難しいです。","It is hard for me to get up early."],["ここで泳ぐことは子どもにとって危険です。","It is dangerous for children to swim here."],

["毎日走ることは私たちにとってよいことです。","It is good for us to run every day."],["野菜を食べることはあなたにとってよいことです。","It is good for you to eat vegetables."],
["漢字を読むことは私の弟にとって難しいです。","It is hard for my brother to read kanji."],["夜に外出することは私にとってこわいです。","It is scary for me to go out at night."]]},

{g:3,id:"c05",t:"現在完了（完了）",s:"have/has + 過去分詞（完了）",q:[

{g:3,id:"c03",t:"現在完了（継続）",s:"have/has + 過去分詞（継続）",q:[

{g:3,id:"c11",t:"間接疑問文",s:"I know ... / Tell me ... の語順",q:[

ng 2","suddenly","副","突然、急に","Oh? My computer [[suddenly]] died.","あれ？パソコンが急に動かなくなりました。"],["w2-425","Reading 2","Turkish","形","トルコ(人)の","Kebab is a traditional [[Turkish]] dish.","ケバブは伝統的なトルコ料理のひとつです。"],["w2-426","Reading 2","run short","表","不足する","We're [[running short]] of milk. — I'll go buy some.","牛乳が足りない。— 買ってくるよ。"],["w2-427","Reading 2","goodwill","名","親善、好意","What is a [[goodwill]] game?","親善試合ってなに？"],["w2-428","Reading 2","mission","名","使節、任務、使命","We have completed our [[mission]], haven't we?!","私たち、ミッション完了したよね？！"],["w2-429","Reading 2","however","副","しかし","This, [[however]], is not easy. Let's work hard.","これは、だけど、簡単じゃないよ。がんばろう。"],["w2-430","Reading 2","Turkey","名","トルコ","Where in [[Turkey]] are you from?","トルコのどこ出身？"],["w2-431","Reading 2","met","動","meet(会う)の過去形《過去分詞も同形》","We [[met]] on the bus one day.","ある日、ぼくたちはバスの中で出会ったんだ。"],["w2-432","Reading 2","typhoon","名","台風","Let's go home now because a [[typhoon]] is coming.","台風が来てるからもう帰ろう。"],["w2-433","Reading 2","sank","動","sink(沈む)の過去形","The clouds were so beautiful after the sun [[sank]].","太陽が沈んだあとの雲がすごくきれいだったよ。"],["w2-434","Reading 2","coast","名","海岸","San Francisco is on the west [[coast]] of the U.S.","サンフランシスコはアメリカの西海岸にあります。"],["w2-435","Reading 2","die","動","死ぬ","My grandfather [[died]] at the age of 100.","祖父は100歳で亡くなりました。"],["w2-436","Reading 2","more than ~","表","〜より多い","I can't do [[more than]] one thing at a time.","一度に2つ以上のことができないの。"],["w2-437","Reading 2","on the way to ~","表","〜へ行く[もどる]途中で","I saw him [[on the way to]] school.","学校へ行く途中、彼を見たよ。"],["w2-438","Reading 2","nearby","形","近くの","Oops, I got a flat. Is there a bike shop [[nearby]]?","うわ、パンクした。近くに自転車屋さんあるかな？"],["w2-439","Reading 2","fishing","名","漁業","Oh, you brought a [[fishing]] rod? That's so you!","え、釣りざお持ってきたの？さすがだなー！"],["w2-440","Reading 2","village","名","村","Akira is from a small [[village]] in Saga.","アキラは佐賀の小さな村の出身です。"],["w2-441","Reading 2","survivor","名","生存者","Let's hope there will be more [[survivors]].","ほかにも生存者がいることを祈り cket","名","入場券、切符","You can buy the [[tickets]] on the internet.","チケットはネットで買えるよ。"],["w2-461","Program 7","penguin","名","ペンギン","Only that [[penguin]] walks slowly.","あのペンギンだけ歩くの遅いよ。"],["w2-462","Program 7","sea otter","名","ラッコ","Those [[sea otters]] are dancing, aren't they?","あのラッコたち、踊ってない？"],["w2-463","Program 7","adorable","形","とてもかわいい","Pochi is so [[adorable]].","ポチがかわいくてかわいくて。"],["w2-464","Program 7","information","名","情報","This [[information]] is wrong!","この情報まちがってる！"],["w2-465","Program 7","shellfish","名","貝類","I'm sorry. I can't eat [[shellfish]].","ごめん。私、貝類食べられない。"],["w2-466","Program 7","cheek","名","ほほ","Ow! I bit my [[cheek]]!","痛っ！口の中噛んだ！"],["w2-467","Program 7","fur","名","毛皮","Look! Pochi has lots of sticky burs on his [[fur]]!","見て！ポチの毛にひっつき虫がいっぱいついてる！"],["w2-468","Program 7","palm","名","手のひら","Show me the [[palm]] of your left hand.","左の手のひらを見せて。"],["w2-469","Program 7","~ times a day","表","1日に〜回","Please take this medicine three [[times a day]].","この薬を1日3回服用してください。"],["w2-470","Program 7","all over ~","表","〜のいたるところに","Shoot! I got powder [[all over]] my hands!","もう！手が粉だらけ！"],["w2-471","Program 7","in order to ~","表","〜するために","I went to the library [[in order to]] borrow a book. Then ....","本を借りるために図書館に行ったの。そしたら…"],["w2-472","Program 7","warm up ~","表","〜を温める","Can you [[warm up]] this one, please? — All right.","これを温めてもらえますか？— はい。"],["w2-473","Program 7","agree","動","同意する、賛成する","My mom and I don't [[agree]] on everything.","お母さんと私って、何につけても意見が合わないんだよね。"],["w2-474","Program 7","smart","形","頭のよい、かしこい","Gon is so [[smart]].","ゴンはめっちゃかしこいんだよ。"],["w2-475","Program 7","mammal","名","ほ乳類","Why are platypuses [[mammals]] if they lay eggs?","カモノハシは卵を産むのだとすると、なんで哺乳類？"],["w2-476","Program 7","breathe","動","息をする、呼吸する","[[Breathe]] in, breathe out.","息吸ってー、吐いてー。"],["w2-477","Program 7","half","名","半分","The first [[half]] is over.","前半が終わった。"],["w2-478","Program 7","brain","名","脳","My [[brain]] is still asleep.","まだ頭が寝てるの。"],["w2-479","Program 7","awake","形","目がさめて","I'm usually [[awake]] by 7 a.m.","私はたいてい午前7時には起きています。"],["w2-480","Program 7","surprising","形","おどろくべき、意外な","Something [[surprising]] happened yesterday.","昨日、びっくりすることがあってさ。"],["w2-481","Program 7","quite","副","非常に、まったく","They're similar, but [[quite]] different actually.","それらは似ているけれど、実際にはかなりちがうのです。"],["w2-482","Program 7","have no idea","表","わからない","I [[have no idea]] what I want to do with my life.","自分が人生で何をしたいのか全然わからないな。"],["w2-483","Program 7","flying fish","名","トビウオ","Why can [[flying fish]] fly? — I don't know.","トビウオってどうして飛べるの？— なんでだろう。"],["w2-484","Program 7","though","接","〜だけれども","[[Though]] I didn't know why, I stayed positive.","理由はわからなかったけれど、ぼくは前向きだった。"],["w2-485","Program 7","enemy","名","敵","My [[enemy]] is mostly me, myself.","俺の敵はだいたい俺です。"],["w2-486","Program 7","seabird","名","海鳥","There are a lot of [[seabirds]] around here.","このあたりには海鳥がたくさんいるんだね。"],["w2-487","Program 7","stock","名","だし、煮出し汁","I made the soup with chicken [[stock]].","とり肉のだしを使ってスープを作った。"],["w2-488","Program 7","fry","動","油であげる、フライにする","These are good! — I just [[fried]] them in olive oil.","おいしい！— オリーブオイルであげただけよ。"],["w2-489","Program 7","fried","形","油であげた","[[Fried]] food is always delicious!","揚げ物ってなんでもおいしいよね。"],["w2-490","Program 7","not always ~","表","いつも[必ずしも]〜とは限らない","Mike is [[not always]] right.","マイクがいつも正しいとは限らないよ。"],["w2-491","Program 7","lovely","形","愛らしい、美しい","Thank you for the [[lovely]] present the other day.","この間は、すてきなプレゼントありがとう。"],["w2-492","Program 7","nighttime","名","夜間","The city is beautiful at [[nighttime]].","夜は、街が美しいね。"],["w2-493","Program 7","daytime","名","昼間","Tama is wrapped in a blanket in the [[daytime]].","タマは、昼間は毛布にくるまっています。"],["w2-494","Program 7","sunflower","名","ヒマワリ","My Hamtaro only eats organic [[sunflower]] seeds.","うちのハム太郎ね、有機ひまわりの種しか食べないんだよ。"],["w2-495","Program 7","seed","名","種、種子","I'm going to plant [[seed]] potatoes here.","ここに種イモ植えようっと。"],["w2-496","Program 7","mice","名","mouse(ネズミ)の複数形","Where do [[mice]] live?","ネズミってどこに住んでるんだろう？"],["w2-497","Program 7","hamster","名","ハムスター","What's that noise? — My [[hamster]] is running.","あれ何の音？— ハムスターが走ってるの。"],["w2-498","Program 7","grass","名","草","Do you like it? — It tastes a little like [[grass]].","おいしい？— ちょっと草の味がする。"],["w2-499","Program 7","pocket","名","ポケット","What's in your [[pocket]]?","ポケットに何入ってるの？"],["w2-500","Program 7","told","動","tell(言う)の過去形《過去分詞も同形》","See, I [[told]] you. You're amazing.","ほらね、言ったでしょ。きみはすごいんだから。"],["w2-501","Program 8","lasting","形","長く続く、永続的な","The first impression is a [[lasting]] impression.","第一印象はいつまでも残るものです。"],["w2-502","Program 8","taken","動","take(とる)の過去分詞","I'm sorry, but all the tables are [[taken]].","申し訳ございません、ただいま満席でございます。"],["w2-503","Program 8","email","名","Eメール、電子メール","Can you [[email]] the URL?","そのURLをメールで送ってもらっても？"],["w2-504","Program 8","seen","動","see(見る)の過去分詞","How can we get out of here without being [[seen]]?","見つからないようにここを出るにはどうすれば？"],["w2-505","Program 8","kitchen","名","台所、キッチン","I like spending time in the [[kitchen]].","私はキッチンで過ごすのが好きです。"],["w2-506","Program 8","sold","動","sell(売る)の過去形《過去分詞も同形》","The scarf I wanted to buy was [[sold]] out.","買いたいと思ってたマフラーが売り切れてたの。"],["w2-507","Program 8","stationery","名","文房具","I love buying [[stationery]].","私は文房具を買うのが大好きです。"],["w2-508","Program 8","store","名","店","This convenience [[store]] is always crowded.","このコンビニいつも混んでる。"],["w2-509","Program 8","line","名","線","Draw a [[line]] in your notebook.","ノートに線を1本ひいてください。"],["w2-510","Program 8","tourist","名","観光客、旅行者","Are you a [[tourist]] or a local?","旅行者ですか？それとも地元の方ですか？"],["w2-511","Program 8","built","動","build(建てる)の過去分詞《過去形も同形》","Gondolas are always [[built]] in black.","ゴンドラはいつも黒で作られます。"],["w2-512","Program 8","written","動","write(書く)の過去分詞","My name is only [[written]] in hiragana.","私の名前は平仮名だけで書きます。"],["w2-513","Program 8","sung","動","sing(歌う)の過去分詞","The theme song is [[sung]] by AIMYON.","主題歌はあいみょん。"],["w2-514","Program 8","paint","動","(絵の具などで絵を)描く","Who [[painted]] this?! — Me. Isn't it like a Basquiat?","これだれが描いたの？！— オレ。バスキアみたいじゃない？"],["w2-515","Program 8","known","動","know(知る)の過去分詞","Mt. Fuji is [[known]] for its beautiful natural shape.","富士山は、その形の自然な美しさで知られています。"],["w2-516","Program 8","fill","動","満たす","[[Fill]] in the blanks with the words below.","下の語句を使って空欄を埋めなさい。"],["w2-517","Program 8","wood","名","木材、(sをつけて)森","I feel like taking a walk in the [[woods]].","森の中をお散歩したい気分。"],["w2-518","Program 8","neither","副","(否定文で)〜もまた…ない","I didn't study at all yesterday. — Me, [[neither]].","昨日、全然勉強しなかったよ。— オレも。"],["w2-519","Program 8","absolutely","副","(返答で)まったくそのとおり","Can I see? — [[Absolutely]] not!","見ていい？— 絶対だめ！"],["w2-520","Program 8","broken","動","break(壊れる、悲しくさせる)の過去分詞","We've [[broken]] up. — Why?!","別れちゃった。— なんでよ？！"],["w2-521","Program 8","soap","名","せっけん","This [[soap]] smells good. — Yeah, I like it.","この石けん、いいにおいがする。— うん、気に入ってるの。"],["w2-522","Program 8","clay","名","粘土","It has been a long time since I last touched [[clay]]!","粘土さわるの、めっちゃ久しぶり！"],["w2-523","Program 8","recycled","形","再生利用[リサイクル]された","This box is made with 100% [[recycled]] paper.","この箱は100%再生紙でできています。"],["w2-524","Program 8","paper crane","名","折り鶴","You're really good at folding [[paper cranes]].","折り鶴を折るのうまいね。"],["w2-525","Program 8","take a look","表","ちらりと見る、見てみる","[[Take a look]] at the map. Where are we?!","ちょっと地図見て。今どこ？！"],["w2-526","Program 8","Same here.","表","私も同じです。","I'm a little tired today. — [[Same here]].","なんか今日少し疲れた。— 私も。"],["w2-527","Program 8","monument","名","記念碑、慰霊碑","What is written on the [[monument]]?","その記念碑には何と書かれていますか？"],["w2-528","Program 8","victim","名","犠牲者","The animals here are all innocent [[victims]].","ここにいる動物たちはみな、罪のない犠牲者です。"],["w2-529","Program 8","atomic","形","原子(力)の","On August 6, an [[atomic]] bomb was dropped.","8月6日に、原爆が落とされました。"],["w2-530","Program 8","bomb","名","爆弾","They say a [[bomb]] was found in a hotel in London.","ロンドンのホテルで爆弾が見つかったって。"],["w2-531","Program 8","pass","動","(遠まわしに)亡くなる、通り過ぎる","Where're you now? — I just [[passed]] the big tree.","今どこ？— でっかい木を通過したところよ。"],["w2-532","Program 8","away","副","(消え)去って、離れて","That man went [[away]] without saying a single word.","その人、ひとことも言わずに立ち去った。"],["w2-533","Program 8","get well","表","(体調が)よくなる","[[Get well]] soon! Take care.","早くよくなってね！お大事に。"],["w2-534","Program 8","pass away","表","亡くなる","My grandmother [[passed away]] last night.","昨夜、祖母が他界しました。"],["w2-535","Program 8","receive","動","受け取る","Why does it take so long to [[receive]] an email?","メール1通を受信するのに、なんでこんなに時間がかかるの？"],["w2-536","Program 8","million","名・形","100万(の)","Her first album sold more than 7 [[million]] copies.","彼女のファーストアルバムは700万枚以上売れたんだよ。"],["w2-537","Program 8","recycle","動","再生利用[リサイクル]する","Remember. Reduce. Reuse. [[Recycle]].","忘れないで。減らすこと。再利用すること。再生利用すること。"],["w2-538","Program 8","relay","動","伝える、中継する","The news was [[relayed]] by radio.","ニュースはラジオで中継されました。"],["w2-539","Program 8","fold","動","折る","First, [[fold]] the paper in two.","まず、紙を2つに折ってください。"],["w2-540","Program 8","renew","動","新たにする","Oh! I need to [[renew]] my passport!","あ！パスポート更新しないと！"],["w2-541","Program 8","make the most of ~","表","〜を最大限に活用する","You should [[make the most of]] your time.","時間を最大限に活用したほうがいいよ。"],["w2-542","Program 8","mascot","名","マスコット","Hirosaki's [[mascot]] is so cute. — What's it like?","弘前のマスコットかわいいんだ。— どんなの？"],["w2-543","Program 8","wear","動","身につけている、着ている","Why are you [[wearing]] an apron? — Oops.","なんでエプロンしてるの？— あっ。"],["w2-544","Program 8","tin","名","ブリキ、スズ","This old toy car is made of [[tin]].","この古いおもちゃの車はブリキでできています。"],["w2-545","Program 8","badge","名","バッジ","These [[badges]] are cool. — Here, I'll give you one.","このバッジかっこいい。— 1つあげるよ。"],["w2-546","Program 8","so ~ that …","表","あまりに〜なので…","I'm [[so]] excited that I couldn't sleep last night!","わくわくしすぎて夕べ眠れなかった！"],["w2-547","Program 8","drew","動","draw(描く)の過去形","Who [[drew]] the face on the mikan? — Not me.","みかんに顔描いたのだれ？— 私じゃない。"],["w2-548","Program 8","drawn","動","draw(描く)の過去分詞","Who was this [[drawn]] by?","これだれによって描かれたんだろうね。"],["w2-549","Program 8","straw","名","ストロー","Shoot. I can't get the tapioca with the [[straw]].","もう。ストローでタピオカ吸えない。"],["w2-550","Program 8","wine","名","ワイン、ブドウ酒","Wait, [[wine]] is made from grapes, right?","待って、ワインってぶどうからできてるんだよね？"],["w2-551","Power-Up 5","attention","名","注意、注目、(アナウンスで)お知らせします","Pay [[attention]] to the spelling, too.","つづりにも注意しよう。"],["w2-552","Power-Up 5","passenger","名","乗客","All [[passengers]] need passports.","すべての乗客にパスポートが必要です。"],["w2-553","Power-Up 5","flight","名","定期航空便(の飛行機)、フライト、飛行","This is my first [[flight]]. I'm nervous.","飛行機に乗るの初めてなんだ。緊張する。"],["w2-554","Power-Up 5","boarding","名","搭乗","Do you have your [[boarding]] pass? — Oh? Where is it?!","搭乗券持った？— あれ？どこだ？！"],["w2-555","Power-Up 5","apologize","動","あやまる","I [[apologize]] for the inconvenience.","ご不便をおかけして申し訳ございません。"],["w2-556","Power-Up 5","inconvenience","名","不便、迷惑","[[Inconvenience]] isn't always a bad thing.","不便って悪いことばかりじゃないんだよ。"],["w2-557","Power-Up 5","minute","名","(時間の)分","The show starts in two [[minutes]].","ショーはあと2分で始まります。"],["w2-558","Power-Up 5","flight attendant","名","(旅客機の)客室乗務員","The [[flight attendant]] was attractive, wasn't she?","あの客室乗務員さん、かっこよかったね。"],["w2-559","Power-Up 5","mineral water","名","ミネラルウォーター","My mom only drinks [[mineral water]].","うちのママ、飲み物はミネラルウォーターしか飲まないの。"],["w2-560","Power-Up 5","sparkling water","名","発泡水","Would you like still or [[sparkling water]]?","普通の水と炭酸入りの水、どちらがよろしいですか？"],["w2-561","Step 5 for Our Project","casual","形","ふだん着の、カジュアルな","For my grandma, a kappogi is like [[casual]] wear.","おばあちゃんにとって、割烹着は普段着のようなものなの。"],["w2-562","Step 5 for Our Project","chat","動","おしゃべりをする","Grandma! — I was [[chatting]] with the neighbor.","ばーちゃん！— ご近所さんとおしゃべりしとったんじゃよ。"],["w2-563","Our Project 6","born","動","bear(生む)の過去分詞 (be born)で生まれる","You were [[born]] under a lucky star!","きみは幸運の星の下に生まれたんだね！"],["w2-564","Our Project 6","admire","動","賞賛する、感心する","I [[admire]] his hard work.","あいつの頑張りは本当にすごいと思う。"],["w2-565","Our Project 6","protection","名","保護","You need some head [[protection]].","頭を保 oxygen]] to breathe.","人間は呼吸するために酸素が必要です。"],["w2-583","Reading 3","tank","名","タンク","Some [[tanks]] have turn signals.","戦車には、ウインカーがついているやつもあるんだよ。"],["w2-584","Reading 3","explode","動","爆発する","Something [[exploded]] in the microwave oven.","電子レンジの中で何か爆発したよ。"],["w2-585","Reading 3","reason","名","理由","I don't know. I can't explain the [[reason]].","わからないよ。理由なんて説明できないもん。"],["w2-586","Reading 3","lose","動","失う、のがす","Don't [[lose]] this ticket.","このチケット失くさないでね。"],["w2-587","Reading 3","quickly","副","急速に、すぐに、急いで","Let's eat [[quickly]] and leave.","急いで食べて出発しよう。"],["w2-588","Reading 3","lost","動","lose(失う、のがす)の過去形《過去分詞も同形》","I [[lost]] my smartphone.","スマホ失くしちゃった。"],["w2-589","Reading 3","quietly","副","静かに、穏やかに","We should talk more [[quietly]].","私たちもう少し静かに話したほうがいいね。"],["w2-590","Reading 3","solution","名","解決策","But is this the best [[solution]] to this problem?","でも、これがこの問題のベストな解決策なんだろうか？"],["w2-591","Reading 3","safety","名","無事、安全","Please fasten your seatbelt for your [[safety]].","安全のためにシートベルトを着用してください。"],["w2-592","Reading 3","crew","名","乗組員","How many [[crew]] members are on board this rocket?","このロケットには、乗組員は何人いらっしゃいますか？"],["w2-593","Reading 3","men","名","man(男の人)の複数形","Is this umbrella for [[men]]?","この傘は男性用ですか？"],["w2-594","Reading 3","re-entry","名","(大気圏への)再突入、再び入ること","Small rockets controlled the [[re-entry]].","小型ロケットが再突入を制御しました。"],["w2-595","Reading 3","approach","動","近づく、接近する","I have no time today. The deadline is [[approaching]].","今日は時間ない。締め切りが迫ってて。"],["w2-596","Reading 3","might","助","〜かもしれない","I'm not sure, but it [[might]] be OK like this.","わかんないけど、ひょっとしたらこれでいいのかも。"],["w2-597","Reading 3","damage","動","ダメージ[損害]を与える","Please be careful not to [[damage]] the screen.","画面に傷をつけないようご注意ください。"],["w2-598","Reading 3","extremely","副","極度に、非常に","This coffee is [[extremely]] hot.","このコーヒー、めちゃくちゃ熱いよ。"],["w2-599","Reading 3","fire","名","火","You can start a [[fire]] with sticks. Did you know?","棒で火を起こすことができるんだよ。知ってた？"],["w2-600","Reading 3","at last","表","ついに","I found it [[at last]]! — Good for you!","やっと見つけた！— よかったね！"],["w2-601","Reading 3","contact","動","連絡をとる、接触する","If you need particulars, please [[contact]] us directly.","詳細が必要な場合は、直接ご連絡ください。"],["w2-602","Reading 3","sign","名","きざし、兆候","That may be a [[sign]] of stress. Get some rest.","それはストレスのサインかも。少し休んで。"],["w2-603","Reading 3","parachute","名","パラシュート","The skydiver's [[parachute]] opened just in time.","スカイダイバーのパラシュートはちょうど間に合って開きました。"],["w2-604","Reading 3","appear","動","現れる","The sun [[appeared]] from behind the clouds.","雲の向こうから太陽が出てきたんだよ。"],["w2-605","Reading 3","calm","形","落ち着いた、穏やかな","The ocean is [[calm]] today.","今日は海が穏やかです。"],["w2-606","Reading 3","voice","名","声","His [[voice]] sounds like someone's.","彼の声、だれかの声に似てるんだよな。"],["w2-607","Reading 3","successfully","副","成功して、うまく","He [[successfully]] passed his driving test.","彼は無事に運転免許試験に合格しました。"],["w2-608","Reading 3","wisdom","名","英知、知恵","[[Wisdom]] is knowledge plus experience.","知恵とは、知識と経験を兼ね備えたもののことです。"],["w2-609","Reading 3","teamwork","名","チームワーク、協力","Actually, our [[teamwork]] is getting better, isn't it?","なんかさ、チームワークよくなってきてるよね？"],["w2-610","Reading 3","situation","名","状況","The [[situation]] is similar here, too.","こちらの状況も似たような感じです。"],["w2-611","Reading 3","failure","名","失敗","[[Failure]] teaches success.","失敗は成功のもとだよ。"],["w2-612","Reading 3","option","名","選択(肢)","You have two [[options]]: stay here or leave.","きみには2つの選択肢がある。ここに残るか、出ていくかだ。"],["w2-613","Reading 3","explosion","名","爆発","Didn't you hear the sound of an [[explosion]]?","爆発音しなかった？"],["w2-614","Reading 3","give up ~","表","〜をあきらめる","Don't [[give up]] until the end!","最後まであきらめないで！"],["w2-615", "テスト追加語", "other", "代", "ほかの人[もの]", "One is a cat, and the [[other]] is a dog.", "1匹はネコで、もう1匹はイヌです。"],["w2-616", "テスト追加語", "show", "動", "(〜に…を)見せる", "Can you [[show]] me your notebook?", "ノート見せてくれる？"],["w2-617", "テスト追加語", "farmer", "名", "農場主、農民", "My grandfather is a [[farmer]].", "祖父は農家です。"],["w2-618", "テスト追加語", "back", "名", "背中", "My [[back]] hurts today.", /* ---------- チャレンジ称号・月のコレクション ---------- */
const p2=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const dnum=k=>{const a=k.split('-');return Math.round(Date.UTC(+a[0],+a[1]-1,+a[2])/864e5)};
function newSt(){return {coin:0,own:{},eq:{},dmc:{},dac:0,wk:{},dm:null,dmd:{},dmn:0,star:{},n:0,cor:0,mc:0,bc:0,nm:0,days:{},ip:{},ic:{},ib:{},imp:0,rv:0,mq:{},sm:0,hk:0,bad:{},ms:{}}}
function applyRun(st,r){
  st.n++;st.cor+=r.correct;st.mc=Math.max(st.mc,r.mc||0);st.bc=Math.max(st.bc,r.correct);
  if(r.miss===0&&r.correct>=10)st.nm++;
  st.days[dkey(r.t)]=1;
  const d=DATA.find(x=>x.id===r.id);
  if(d&&(!r.md||r.md==='k')){if(st.ib[d.id]!==undefined&&r.score>st.ib[d.id])st.imp=1;st.ib[d.id]=Math.max(st.ib[d.id]||0,r.score);st.ic[d.id]=(st.ic[d.id]||0)+1;st.ip[d.id]=1;
    if(d.p===-1&&r.miss===0&&r.correct>=10)st.hk=1}
  if(/総復習/.test(r.item||''))st.sm=1;
}
function ensureSt(){if(!S.st||typeof S.st!=='object'){S.st=newSt();(S.runs||[]).forEach(r=>applyRun(S.st,r))}
  if(!S.st.mq||typeof S.st.mq!=='object')S.st.mq={};
  if(!S.st.star||typeof S.st.star!=='object')S.st.star={};
  if(typeof S.st.coin!=='number')S.st.coin=0;
  if(!S.st.own||typeof S.st.own!=='object')S.st.own={};
  if(!S.st.eq||typeof S.st.eq!=='object')S.st.eq={};
  if(!S.st.wk||typeof S.st.wk!=='object')S.st.wk={};
  if(!S.st.vsel||typeof S.st.vsel!=='object')S.st.vsel={};
  if(!S.st.vopt||typeof S.st.vopt!=='object')S.st.vopt={t:60,h:0};
  if(!S.st.dmd||typeof S.st.dmd!=='object')S.st.dmd={};
  if(typeof S.st.dmn!=='number')S.st.dmn=0;
  if(!S.st.dmc||typeof S.st.dmc!=='object')S.st.dmc={};
  Object.keys(S.st.mq).forEach(k=>{if(typeof S.st.mq[k]!=='object')S.st.mq[k]={s:0,t:0}})}
function maxStreak(st,f){const a=Object.keys(st[f||'days']||{}).map(dnum).sort((x,y)=>x-y);let best=0,c=0,pv=null;a.forEach(v=>{c=(pv!==null&&v===pv+1)?c+1:1;pv=v;if(c>best)best=c});return best}
function curStreak(days){const t=dnum(dkey(Date.now()));let n=0,d=days[dkey(Date.now())]?t:t-1;const set=new Set(Object.keys(days||{}).map(dnum));while(set.has(d)){n++;d--}return n}
function gradeProg(st,n){const a=DATA.filter(d=>d.g===n&&d.p!==-1);return [a.filter(d=>st.ip[d.id]).length,a.length]}
function maxIc(st){return Math.max(0,...Object.values(st.ic))}
const CATS=[['combo','🔥','連続正解'],['nm','💎','ノーミス'],['cor','✅','正解数'],['play','🎮','プレイ'],['wide','🗺','幅広さ'],['dig','📈','やりこみ'],['day','📅','連続日数'],['rv','🔁','リベンジ'],['dm','🚀','ミッション']];
const BADGES=[];
(function(){
  const A=(c,ic,nm,ds,f,pg)=>BADGES.push({id:nm,c,ic,nm,ds,t:st=>f(st),pg:pg||null});
  [['🔥','ナイスコンボ',5],['⚡','コンボマスター',10],['🚀','ノンストップ',20],['🌟','ミラクルコンボ',30]].forEach(([i,n,v])=>A('combo',i,n,v+'問連続で正解する',st=>st.mc>=v,st=>[st.mc,v]));
  [['💎','ノーミスクリア',1,'ミスなしで10問以上正解する'],['💠','ノーミス常連',3,'ノーミスを3回達成する'],['👑','完全無欠',10,'ノーミスを10回達成する']].forEach(([i,n,v,d])=>A('nm',i,n,d,st=>st.nm>=v,st=>[st.nm,v]));
  [['✅','10問ヒット',10],['🎯','20問ブレイク',20],['🏅','30問スペシャル',30]].forEach(([i,n,v])=>A('cor',i,n,'1回で'+v+'問正解する',st=>st.bc>=v,st=>[st.bc,v]));
  [['📘','100問クリア',100],['📗','500問クリア',500],['📙','1,000問クリア',1000],['📕','3,000問クリア',3000]].forEach(([i,n,v])=>A('cor',i,n,'累計'+fmt(v)+'問正解する',st=>st.cor>=v,st=>[st.cor,v]));
  [['🎮','はじめの10回',10],['🕹','50回の常連',50],['🏆','100回の達人',100]].forEach(([i,n,v])=>A('play',i,n,v+'回プレイする',st=>st.n>=v,st=>[st.n,v]));
  [1,2,3].forEach(n=>A('wide',['1️⃣','2️⃣','3️⃣'][n-1],n+'年コンプリート',n+'年の全項目を1回以上プレイする',st=>{const a=gradeProg(st,n);return a[0]>=a[1]},st=>gradeProg(st,n)));
  A('wide','🗺','全学年制覇','1〜3年のコンプリートをすべて達成する',st=>[1,2,3].every(n=>{const a=gradeProg(st,n);return a[0]>=a[1]}),st=>[[1,2,3].filter(n=>{const a=gradeProg(st,n);return a[0]>=a[1]}).length,3]);
  A('wide','🔄','ふりかえり上手','総復習を1回プレイする',st=>!!st.sm);
  A('wide','🔍','ひっかけ見破り','ダミーの単語がある復習の項目で、ミスなしでクリアする',st=>!!st.hk);
  A('dig','📈','自己ベスト更新','同じ項目で、前より高い得点を取る',st=>!!st.imp);
  A('dig','🔂','くり返しの達人','同じ項目を3回プレイする',st=>maxIc(st)>=3,st=>[Math.min(3,maxIc(st)),3]);
  [['🌱','芽が出た',3],['🌿','習慣のはじまり',7],['🌳','習慣マスター',14]].forEach(([i,n,v])=>A('day',i,n,v+'日連続でプレイする',st=>maxStreak(st)>=v,st=>[maxStreak(st),v]));
  [['🎯','はじめてのミッション',1],['🎖','ミッション常連',10],['🏵','ミッションマスター',30]].forEach(([i,n,v])=>A('dm',i,n,'デイリーミッションを合計'+v+'回達成する',st=>st.dmn>=v,st=>[st.dmn,v]));
  A('dm','🌈','ミッションコンプリート','1日のデイリーミッションを3つ全部達成する',st=>(st.dac||0)>=1);
  A('dm','🔗','ミッションが日課','3つ全部のミッション達成を7日連続で続ける',st=>maxStreak(st,'dmd')>=7,st=>[Math.min(7,maxStreak(st,'dmd')),7]);
  [['💪','リベンジ成功',10],['🥊','リベンジの達人',50],['👹','リベンジの鬼',100]].forEach(([i,n,v])=>A('rv',i,n,'前にまちがえた問題を、あとで正解する（'+v+'問）',st=>st.rv>=v,st=>[st.rv,v]));
})();
const MOI=['🌅','❄️','🎎','🌸','🎏','🐌','🌻','🎆','🎑','🍁','🌰','⛄'];
const TIERN={3:'皆勤の月',2:'今月の常連',1:'月のはじめ'};
function stampCalc(st){const by={};Object.keys(st.days).forEach(k=>{const m=k.slice(0,7);(by[m]=by[m]||[]).push(+k.slice(8))});const o={};
  for(const m in by){const y=+m.slice(0,4),mo=+m.slice(5);const dim=new Date(y,mo,0).getDate(),n=by[m].length;o[m]=n>=dim?3:n>=15?2:by[m].includes(1)?1:0}return o}
/* ---------- デイリーミッション ---------- */
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>{let a=seed|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const DMCOIN=10,DMALL=30,DMM=[1.1,1.2,1.3];

function nextQuestion(){
  if(g.plan){
    if(g.i>=g.plan.length){if(g.replan){g.plan=g.replan();g.i=0}else{finish();return}}
    const it=g.plan[g.i++];g.cm=it.m;g.q=it.q;g.cq=it.cq||null;g.locked=false;
